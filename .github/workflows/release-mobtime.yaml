name: MobTime Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "semver=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build_linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew jpackage -PinstallerType=deb
      - uses: actions/upload-artifact@v4
        with:
          name: MobTime-Linux
          path: ./build/jpackage/*.deb
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/jpackage/*.deb

  build_windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Download Wix
        shell: powershell
        run: Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe -OutFile wix311.exe
      - name: Install Wix
        shell: powershell
        run: ./wix311.exe /install /quiet /norestart
      - name: Build with Gradle
        shell: powershell
        run: ./gradlew.bat jpackage -PinstallerType=msi
      - uses: actions/upload-artifact@v4
        with:
          name: MobTime-Windows
          path: build/jpackage/*.msi
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/jpackage/*.msi

  build_mac_amd64:
    needs: version
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew jpackage -PinstallerType=pkg
      - uses: actions/upload-artifact@v4
        with:
          name: MobTime-Mac-x86_64
          path: build/jpackage/*.pkg
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/jpackage/*.pkg

  build_mac_arm64:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew jpackage -PinstallerType=pkg
      - uses: actions/upload-artifact@v4
        with:
          name: MobTime-Mac-arm64
          path: build/jpackage/*.pkg
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/jpackage/*.pkg
